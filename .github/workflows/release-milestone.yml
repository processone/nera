name: Release milestone

# Puts every new pull request (drafts included) in the milestone of the release
# currently targeted, named by .github/release-target.json. Changing the target
# means changing that file: only pull requests opened afterwards are affected.
#
# pull_request_target runs from the default branch with a token that can write.
# That is safe here because the job never checks out the pull request's code: it
# reads the target file and the script from the default branch, named explicitly
# because otherwise the checkout would follow the pull request's base branch.
# Every base branch is covered, and so are pull requests from forks: GitHub
# gives pull_request_target a write token for them too.

on:
  pull_request_target:
    types: [opened]

jobs:
  assign:
    name: Assign milestone
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - run: python3 scripts/ci/assign_release_milestone.py --target .github/release-target.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
