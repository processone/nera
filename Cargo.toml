[workspace]
resolver = "2"
members = [
    "crates/nera-syntax",
    "crates/nera-ir",
    "crates/nera-codegen",
    "crates/nera-runtime",
    "crates/nera-fmt",
    "crates/nera",
]
exclude = [
    # Standalone reference implementation — deliberately kept out of the
    # workspace so its release profile and dependencies don't influence
    # (and aren't influenced by) the main nera build.
    "benchmarks/rust_baseline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mickaël Rémond <mremond@process-one.net>"]
license = "Apache-2.0"
repository = "https://github.com/processone/nera"
homepage = "https://github.com/processone/nera"

[workspace.dependencies]
thiserror = "2"
codespan-reporting = "0.11"

[profile.release]
lto = true
codegen-units = 1
